version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: controle_gastos
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: controle_gastos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "controle_gastos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: